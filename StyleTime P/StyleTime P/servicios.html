<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <title>StyleTime - Servicios</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>Catálogo de servicios</h1>
        <a href="index.html">Volver al inicio</a>
    </header>

    <main>
        <section>
            <h2>Registrar servicio</h2>

            <label for="nombre">Servicio:</label>
            <input type="text" id="nombre">

            <label for="duracion">Duración en minutos:</label>
            <input type="number" id="duracion" min="1">

            <label for="precio">Precio en colones:</label>
            <input type="number" id="precio" min="0">

            <button type="button" onclick="agregarServicio()">
                Agregar servicio
            </button>

            <p id="mensaje" class="mensaje"></p>
        </section>

        <section>
            <h2>Servicios disponibles</h2>
            <table>
                <thead>
                    <tr>
                        <th>Servicio</th>
                        <th>Duración</th>
                        <th>Precio</th>
                    </tr>
                </thead>
                <tbody id="tablaServicios"></tbody>
            </table>
        </section>
    </main>

    <script src="js/servicios.js"></script>
</body>
</html>
