<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesión | StyleTime P</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
    <a class="visually-hidden-focusable skip-link" href="#contenido">Saltar al contenido</a>
    <main class="container login-main" id="contenido">
        <div class="login-shell">
            <nav class="login-brand" id="menuPrincipal" aria-label="StyleTime P">
                <a class="navbar-brand d-inline-flex align-items-center gap-2" href="index.html">
                    <span class="brand-icon"><i class="bi bi-scissors" aria-hidden="true"></i></span>
                    <span>StyleTime <span class="brand-suffix">P</span></span>
                </a>
            </nav>
            <div>
                <section class="card section-card login-card" aria-labelledby="accesoTitulo">
                    <div class="card-body login-card-body">
                        <span class="module-icon mb-4"><i class="bi bi-shield-lock" aria-hidden="true"></i></span>
                        <p class="eyebrow mb-2">ACCESO A TU ESPACIO</p>
                        <h1 class="h3 mb-2" id="accesoTitulo">Inicio de sesión</h1>
                        <p class="text-secondary mb-4">Ingresa tus datos de acceso para continuar.</p>
                        <form novalidate onsubmit="ingresar(); return false;">
                            <div class="row g-3">
                                <div class="col-12">
                                    <label class="form-label" for="usuario">Usuario</label>
                                    <div class="input-group has-validation">
                                        <span class="input-group-text"><i class="bi bi-person" aria-hidden="true"></i></span>
                                        <input type="text" id="usuario" class="form-control" required aria-describedby="usuarioAyuda" autocomplete="username">
                                        <div class="invalid-feedback" id="usuarioAyuda">Complete este campo.</div>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <label class="form-label" for="clave">Contraseña</label>
                                    <div class="input-group has-validation">
                                        <span class="input-group-text"><i class="bi bi-key" aria-hidden="true"></i></span>
                                        <input type="password" id="clave" class="form-control" required aria-describedby="claveAyuda" autocomplete="current-password">
                                        <div class="invalid-feedback" id="claveAyuda">Complete este campo.</div>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <button class="btn btn-primary w-100" type="button" onclick="ingresar()">Ingresar<i class="bi bi-arrow-right ms-2" aria-hidden="true"></i></button>
                                </div>
                            </div>
                        </form>
                        <p id="mensaje" class="mensaje" role="status" aria-live="polite" aria-atomic="true"></p>
                        <a class="small d-inline-block mt-4" href="index.html"><i class="bi bi-arrow-left me-2" aria-hidden="true"></i>Volver al inicio</a>
                    </div>
                </section>
            </div>
        </div>
    </main>
    <footer class="login-footer">StyleTime P <span aria-hidden="true">·</span> SC-502 <span aria-hidden="true">·</span> 2026</footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="ui.js"></script>
    <script>
        // La autenticación continúa pendiente de integración.
        function ingresar() {
            let usuario = document.getElementById("usuario").value;
            let clave = document.getElementById("clave").value;

            if (usuario == "" || clave == "") {
                mostrarMensaje("mensaje", "Todos los campos son obligatorios.", "danger");
            } else {
                mostrarMensaje("mensaje", "Formulario completo. Autenticación pendiente.", "info");
            }
        }
    </script>
</body>
</html>
